[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-predictor"
version = "0.2.0"
description = "Research-first soccer predictions — web app + CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
web = [
    "cursor-sdk>=1.0.28",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.scripts]
predict = "predict:main"
predictor-web = "predictor.web.app:main"

[tool.setuptools.packages.find]
include = ["predictor*"]

[tool.setuptools]
py-modules = ["predict"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that start the web server (slower)",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["predictor", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
