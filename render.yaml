services:
  - type: web
    name: soccer-predictor
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PREDICTOR_HOST
        value: "0.0.0.0"
      - key: PREDICTOR_MODEL
        value: composer-2.5
      - key: CURSOR_API_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
